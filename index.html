<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            color: #eee;
            font-family: system-ui, sans-serif;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 48px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }
        .desc {
            color: #aaa;
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #272727;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .card-text {
            padding: 14px;
        }
        .card-text h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .card-text p {
            font-size: 13px;
            color: #aaa;
        }

        /* Lightbox for zoom */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
        .lightbox.active {
            display: flex;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
        <p class="desc">Browse my collection of photos. Click any image to view it in full size.</p>
    </header>

    <div class="gallery">
        <div class="card" onclick="openLightbox('images/pic1.jpg')">
            <img src="images/pic1.jpg" alt="Landscape">
            <div class="card-text">
                <h3>Landscape</h3>
                <p>Natural scenery shot</p>
            </div>
        </div>
        <div class="card" onclick="openLightbox('images/pic2.jpg')">
            <img src="images/pic2.jpg" alt="Still Life">
            <div class="card-text">
                <h3>Still Life</h3>
                <p>Daily snapshots</p>
            </div>
        </div>
        <div class="card" onclick="openLightbox('images/pic3.jpg')">
            <img src="images/pic3.jpg" alt="City View">
            <div class="card-text">
                <h3>City Scene</h3>
                <p>Evening in the city</p>
            </div>
        </div>
    </div>

    <div class="lightbox" id="lb" onclick="closeLightbox()">
        <img id="lb-img" src="">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById("lb-img").src = src;
            document.getElementById("lb").classList.add("active");
        }
        function closeLightbox() {
            document.getElementById("lb").classList.remove("active");
        }
    </script>
</body>
</html>

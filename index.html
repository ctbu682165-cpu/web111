<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture display station</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding: 30px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            transition: 0.3s;
        }
        .gallery-item img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <h1>My picture corridor</h1>
    <div class="gallery">
        <div class="gallery-item">
            <img src="images/pic1.jpg" alt="pictture1">
        </div>
        <div class="gallery-item">
            <img src="images/pic2.jpg" alt="picture2">
        </div>
        <div class="gallery-item">
            <img src="images/pic3.jpg" alt="picture3">
        </div>
    </div>
</body>
</html>
